name: Deploy

# Deploys the Cloud Run side (sdoc-scorer, the sdoc-worker job, sdoc-api)
# only after every CI gate on `main` has passed. This is a separate
# workflow (not `needs:` inside ci.yml) so ci.yml — which also runs on
# every push/PR to every branch — stays untouched; gating instead happens
# via `workflow_run`, which only fires once the named workflow run has
# fully completed, and only for the branch this file's own trigger names.
#
# The Vercel side runs here too, as a separate job. The Vercel GitHub app
# still isn't authorised on applejuice8/secret-hack (only the repo owner
# can do that), so instead of the Git integration we deploy with the CLI
# and a scoped VERCEL_TOKEN. The two jobs are deliberately independent —
# a failed Cloud Run deploy shouldn't strand a web fix, and vice versa.
# The web app resolves API_URL per request, so there is no ordering
# dependency between them. See docs/deploy.md, "Vercel deploys".
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One deploy in flight per branch at a time. Do NOT cancel-in-progress: a
# half-finished `deploy.sh` (scorer up, api still on the old image) is
# worse than a second push queuing behind it.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  id-token: write # Workload Identity Federation — no JSON key ever touches this repo
  contents: read

jobs:
  deploy:
    name: Deploy Cloud Run (scorer, worker, api)
    runs-on: ubuntu-latest
    # Only deploy the exact commit that just passed CI, only on main, and
    # only when every job in that CI run (api, web, images) succeeded.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    env:
      PROJECT_ID: averis-email-system
      REGION: asia-southeast1
      WEB_URL: https://secret-hack.vercel.app
    steps:
      - name: Checkout the commit CI just verified
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: averis-email-system
          workload_identity_provider: projects/969206696114/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: sdoc-deployer@averis-email-system.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Billing-enabled preflight
        # require_billing (scripts/gcp/common.sh) fails fast if billing on
        # averis-email-system is off or linked to the wrong account. It
        # only ever reads billing state — it has no relink permission and
        # never calls `gcloud billing projects link`.
        run: |
          source scripts/gcp/common.sh
          require_billing

      - name: Deploy (scorer -> worker job -> api)
        run: bash scripts/gcp/deploy.sh

      - name: Record deployed revision and URL
        run: |
          source scripts/gcp/common.sh
          revision="$(gcloud_p run services describe sdoc-api --region "$REGION" --format='value(status.latestReadyRevisionName)')"
          url="$(gcloud_p run services describe sdoc-api --region "$REGION" --format='value(status.url)')"
          {
            echo "### Cloud Run deploy"
            echo ""
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Service: sdoc-api"
            echo "- Revision: \`$revision\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live deployment
        run: bash scripts/gcp/smoke.sh

  web:
    name: Deploy web (Vercel)
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    env:
      # Org/project ids are not secret, but they live in repo secrets so the
      # whole Vercel config moves as one unit.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout the commit CI just verified
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # `vercel build` runs on this runner, not on Vercel, so it installs the
      # web dependencies here with the project's package manager. Without
      # pnpm on PATH it fails with `spawn pnpm ENOENT`. Same version CI pins.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for Vercel credentials
        id: creds
        # Warn and stop rather than fail: until someone adds the three
        # secrets, the Cloud Run deploy above should still report green.
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vercel deploy skipped::Set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in repo secrets. Web is still deployed by hand (npx vercel --prod)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Every CLI call runs from the repo root. The Vercel project's Root
      # Directory is already `web`, so running these inside web/ makes
      # Vercel look for web/web.
      - name: Pull production project settings
        if: steps.creds.outputs.present == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        if: steps.creds.outputs.present == 'true'
        id: deploy
        run: |
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record deployed URL
        if: steps.creds.outputs.present == 'true'
        run: |
          {
            echo "### Vercel deploy"
            echo ""
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Alias: https://secret-hack.vercel.app"
          } >> "$GITHUB_STEP_SUMMARY"
