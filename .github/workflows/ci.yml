name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check api
      # no NEON_DB_URI / OPENROUTER_API_KEY on purpose: the suite must pass
      # with no database and no model behind it
      - run: uv run pytest api/tests -q
        env:
          DATA_DIR: docs-provided/problem-statement/sdoc-hackathon-bundle

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
