[project]
name = "averis-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "httpx>=0.28.1",
    "joblib==1.6.0",
    "openai>=3.16.2",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scikit-learn==1.9.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0,<8",
    "mypy>=2.3.1",
    "nbclient>=0.10.2,<1",
    "nbformat>=5.10.4,<6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# B008 is how FastAPI declares dependencies; the synonym/regex tables read
# better on one long line than wrapped.
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
