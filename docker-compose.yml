# SDOC Verifier — web + api + provided scorer (dev/eval).
#   docker compose up --build
# web -> http://localhost:3000   api -> http://localhost:8000   scorer -> :8080
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env               # NEON_DB_URI, OPENROUTER_API_KEY
    environment:
      DATA_DIR: /data
      GMAIL_DATA_DIR: /data-gmail
      UPLOAD_DATA_DIR: /data-uploads
      SCORER_URL: http://scorer:8000
    volumes:
      - ./docs-provided/problem-statement/sdoc-hackathon-bundle:/data:ro
      - gmail-data:/data-gmail
      - upload-data:/data-uploads
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      target: dev
    environment:
      API_URL: http://api:8000            # server-side fetch (compose DNS)
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - api

  scorer:                        # provided eval server; dev-only dependency
    build: ./docs-provided/problem-statement/sdoc-hackathon-docker/server
    volumes:
      - ./docs-provided/problem-statement/sdoc-hackathon-docker/data_v2:/data:ro
      - ./docs-provided/problem-statement/sdoc-hackathon-docker/data_v2/ground_truth.json:/secrets/ground_truth.json:ro
    ports:
      - "8080:8000"

volumes:
  gmail-data:                    # writable store for Gmail-ingested attachments
  upload-data:                   # writable store for manually uploaded documents
