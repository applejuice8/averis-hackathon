# SDOC Verifier — web + api + provided scorer (dev/eval).
#   docker compose up --build
# web -> http://localhost:3000   api -> http://localhost:8000   scorer -> :8080
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:                    # NEON_DB_URI, OPENROUTER_API_KEY
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      GMAIL_DATA_DIR: /data-gmail
      SCORER_URL: http://scorer:8000
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - uploads:/data/uploads    # dataset is baked into the image; only uploads persist
      - gmail-data:/data-gmail
    ports:
      - "8000:8000"
    # HEALTHCHECK is baked into api/Dockerfile (hits /livez); no override needed here.

  web:
    build:
      context: ./web
      target: dev                          # next dev with hot reload
    environment:
      API_URL: http://api:8000            # server-side fetch (compose DNS)
      WATCHPACK_POLLING: "true"           # reliable file watching in Docker on macOS + Windows
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app                         # live source
      - /app/node_modules                  # keep the image's installed deps
      - /app/.next                         # keep the container's build cache
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  scorer:                        # provided eval server; dev-only dependency
    build: ./docs-provided/problem-statement/sdoc-hackathon-docker/server
    volumes:
      - ./docs-provided/problem-statement/sdoc-hackathon-docker/data_v2:/data:ro
      # answer key stays out of git: see secrets/README.md
      - ./secrets/ground_truth.json:/secrets/ground_truth.json:ro
    ports:
      - "8080:8000"

volumes:
  uploads:                       # writable store for uploaded files (mirrors Cloud Run bucket mount)
  gmail-data:                    # writable store for Gmail-ingested attachments
